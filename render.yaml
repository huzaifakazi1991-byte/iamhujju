# iamhujju — Render blueprint (Next.js platform app)
# Deploy: Render dashboard → NewBlueprint / or your existing service re-syncs on push to main.
# Secrets marked `sync: false` must be set in the Render dashboard (never commit them).

services:
  - type: web
    name: iamhujju-platform
    runtime: node
    region: oregon
    plan: starter
    branch: main
    rootDir: platform
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false          # PostgreSQL connection string (Neon / Render Postgres)
      - key: JWT_SECRET
        generateValue: true  # first sync generates & stores a secure random secret
      - key: KEY_ENCRYPTION_SECRET
        generateValue: true  # used to encrypt provider API keys at rest
      - key: APP_URL
        value: https://iamhujju.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Optional integrations — leave unset to run on built-in mock provider / mock checkout
      - key: REDIS_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_URL
        sync: false
